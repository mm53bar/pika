# Pika — Docker Compose template.
#
# Copy this into your stack, set the volume path, the `user:` UID:GID, and the
# secret, then deploy.
#
# ONE container runs both the web server and background jobs: config/puma.rb boots
# the Solid Queue supervisor in-process whenever RAILS_ENV=production, so there's
# no separate worker service and no Redis.
#
# NO AUTHENTICATION. Pika has no login system by design — it holds one person's
# gear, with nothing that differs by viewer (docs/adr/20260926-no-auth-needed.md).
# It also accepts unauthenticated writes, so a loader or agent can post without
# carrying a token. Only run it somewhere that isn't publicly reachable: a
# LAN-only bind, or a reverse proxy that resolves internally.
#
# Nothing real belongs in this file — it lives in a public repository. Keep the
# actual secret and paths in your deployed copy only.

services:
  pika:
    image: ghcr.io/mm53bar/pika:latest
    user: "1000:1000"                # UID:GID that owns the volume below
    restart: unless-stopped
    # `always` re-checks the registry on every `up`; use `missing` if the host has
    # no registry auth for a private image (avoids a failed manifest check).
    pull_policy: missing
    volumes:
      - /path/to/config:/rails/storage:rw   # SQLite databases — must persist
    ports:
      - "3000:8080"                  # host:container — the container port is fixed at 8080
    environment:
      TZ: UTC
      # Rails session/cookie signing key (required). Generate with: openssl rand -hex 64
      SECRET_KEY_BASE: replace-with-64-byte-hex
      # Purchase intake (optional — leave these out and it stays off).
      # IMAP_HOST: imap.example.com
      # IMAP_PORT: "993"
      # IMAP_USERNAME: inbox@example.com
      # IMAP_PASSWORD: an-app-password
      # INTAKE_MAILBOX: INBOX            # where to read (default INBOX)
      # INTAKE_ARCHIVE_MAILBOX: Pika     # where claimed mail is moved (default Pika)
      # Any OpenAI-compatible chat endpoint; reads the emails. Without it nothing is claimed.
      # LLM_BASE_URL: http://llm.example.internal:11434/v1
      # LLM_MODEL: some-model
      # LLM_API_KEY: optional
