production:
  # Every 15 minutes, offset from the quarter hours. Another app reading the same
  # mailbox polls on them, and both share one LLM account whose concurrency
  # limit answers 429 to overlapping calls.
  email_intake:
    class: EmailIntakeJob
    schedule: "7,22,37,52 * * * *"
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
